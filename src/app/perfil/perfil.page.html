<ion-content class="ion-padding" style="background-color: #e0e7ff;">

  <!-- PERFIL DO USUÁRIO -->
  <div class="card shadow-lg mb-5 border-0 mx-auto text-center p-4" 
       style="max-width: 400px; background-color: #ffffff; border-radius: 30px;">
    <img *ngIf="perfil.picture" [src]="perfil.picture"
         class="rounded-circle mb-3 shadow" 
         style="width:120px; height:120px; object-fit:cover; border:4px solid #6366f1;">
    <h4 class="card-title mb-1 fw-bold" style="color:#1e293b;">{{ perfil.name }}</h4>
    <p class="text-muted mb-0" style="color:#64748b;">{{ perfil.email }}</p>
  </div>

  <!-- CRIAR NOVA POSTAGEM -->
  <div class="card shadow-lg mb-5 border-0 mx-auto p-4" 
       style="max-width: 520px; background-color: #ffffff; border-radius: 30px;">
    <textarea [(ngModel)]="novaPostagem.description" 
              class="form-control mb-3 rounded-4 p-3 shadow-sm" 
              style="resize:none; min-height:120px; background-color: #f5f5ff; border:none; color:#334155;" 
              placeholder="O que você está pensando?"></textarea>
    <input type="text" [(ngModel)]="novaPostagem.picture" 
           class="form-control mb-3 rounded-4 p-2 shadow-sm" 
           style="background-color: #f5f5ff; border:none; color:#334155;" 
           placeholder="URL da imagem (opcional)">
    <button (click)="criarPost()" 
            class="btn w-100 rounded-pill fw-bold shadow-sm" 
            style="background-color:#6366f1; color:white;">
      Postar
    </button>
  </div>

  <!-- FEED DE POSTAGENS -->
  <div *ngFor="let post of posts" class="card shadow-sm mb-4 border-0 mx-auto p-3" 
       style="max-width: 520px; background-color: #ffffff; border-radius: 30px;">
    <div class="d-flex align-items-center mb-3">
      <img *ngIf="post.user.picture" [src]="post.user.picture" 
           class="rounded-circle me-3 shadow-sm" 
           style="width:50px; height:50px; object-fit:cover; border:2px solid #6366f1;">
      <div>
        <strong class="fw-bold" style="color:#1e293b;">{{ post.user.name }}</strong><br>
        <small class="text-muted" style="color:#64748b;">{{ post.created_at | date:'short' }}</small>
      </div>
    </div>
    <p class="mb-3" style="font-size: 0.95rem; line-height:1.5; color:#334155;">{{ post.description }}</p>
    <img *ngIf="post.picture" [src]="post.picture" 
         class="img-fluid rounded-4 mb-2 shadow-sm" 
         style="max-height:350px; object-fit:cover; width:100%; border:2px solid #6366f1;">
  </div>

</ion-content>
