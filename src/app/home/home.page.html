<ion-content class="ion-padding feed-container">

  <!-- BARRA SUPERIOR -->
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Feed</ion-title>
      <ion-buttons slot="end">
        <ion-button (click)="logout()">Logout</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- NOVA POSTAGEM -->
  <div class="post-card new-post">
    <textarea [(ngModel)]="novaPostagem.description" 
              class="post-textarea" 
              placeholder="O que você está pensando?"></textarea>
    <input type="text" [(ngModel)]="novaPostagem.picture" 
           class="post-input" 
           placeholder="URL da imagem (opcional)">
    <button (click)="criarPost()" class="btn-post">Publicar</button>
  </div>

  <!-- LISTA DE POSTS -->
  <ion-list>
    <ion-item *ngFor="let post of posts" lines="none">
      <ion-avatar slot="start">
        <img *ngIf="post.user.picture" [src]="post.user.picture">
        <img *ngIf="!post.user.picture" src="assets/default-avatar.png">
      </ion-avatar>
      <ion-label>
        <h2>{{ post.user.name }}</h2>
        <p>{{ post.description }}</p>
        <img *ngIf="post.picture" [src]="post.picture" class="post-image">
        <small>{{ post.created_at | date:'short' }}</small>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
