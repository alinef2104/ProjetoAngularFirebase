<ion-content [fullscreen]="true" class="fundo-roxo">

  <ion-row class="ion-justify-content-center ion-align-items-center altura-total">
    <ion-col size="12" size-md="6" size-lg="4">

      <div class="card-cadastro">
        <h2 class="titulo-cadastro">Cadastro</h2>

        <ion-item class="input-cadastro">
          <ion-input placeholder="Nome" [(ngModel)]="usuario.name" name="name" required></ion-input>
        </ion-item>

        <ion-item class="input-cadastro">
          <ion-input type="email" placeholder="E-mail" [(ngModel)]="usuario.email" name="email" required></ion-input>
        </ion-item>

        <ion-item class="input-cadastro">
          <ion-input type="password" placeholder="Senha" [(ngModel)]="usuario.password" name="password" required></ion-input>
        </ion-item>

        <ion-item class="input-cadastro">
          <ion-input type="password" placeholder="Confirmar Senha" [(ngModel)]="usuario.password_confirmation" name="password_confirmation" required></ion-input>
        </ion-item>

        <ion-button expand="block" shape="round" class="botao-cadastro" (click)="cadastrar()">
          Cadastrar
        </ion-button>
      </div>

    </ion-col>
  </ion-row>

</ion-content>
