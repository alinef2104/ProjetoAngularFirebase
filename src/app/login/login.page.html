<ion-content [fullscreen]="true" class="fundo-roxo">

  <ion-row class="ion-justify-content-center ion-align-items-center altura-total">
    <ion-col size="12" size-md="6" size-lg="4">

      <div class="card-login">
        <h2 class="titulo-login">Login</h2>

        <ion-item class="input-login">
          <ion-input type="email" placeholder="Email" [(ngModel)]="loginData.email"></ion-input>
        </ion-item>

        <ion-item class="input-login">
          <ion-input type="password" placeholder="Senha" [(ngModel)]="loginData.password"></ion-input>
        </ion-item>

        <ion-button expand="block" shape="round" class="botao-login" (click)="login()">
          Entrar
        </ion-button>
      </div>

    </ion-col>
  </ion-row>

</ion-content>
